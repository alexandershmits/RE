name: link-check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Падает только при мёртвых ссылках (404/410, нет домена); отказы ботам и таймауты — лишь в отчёте.
      - run: python tools/check_links.py
