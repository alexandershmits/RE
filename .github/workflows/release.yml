name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, exe: re50, asset: re50-linux-x64 }
          - { os: windows-latest, exe: re50.exe, asset: re50-windows-x64.exe }
          - { os: macos-latest, exe: re50, asset: re50-macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        # vX.Y и vX.Y.Z обозначают версию X.Y.0 и X.Y.Z (прежние теги проекта — v7.1)
        run: bash tools/check_release_tag.sh "$GITHUB_REF_NAME" "$(cargo pkgid | sed 's/.*[#@]//')"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Name the binary per platform
        shell: bash
        run: cp "target/release/${{ matrix.exe }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: python3 tools/changelog_section.py > release-notes.md
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
