version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      egui:
        patterns: ["egui*", "eframe", "epaint*", "emath", "ecolor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
