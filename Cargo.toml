[package]
name = "re50"
version = "7.2.0"
edition = "2021"
rust-version = "1.95"
description = "RE-50: Reverse Engineering course app (CS50-style) — lectures, labs, problem sets, quizzes, achievements"
license = "MIT"
repository = "https://github.com/alexandershmits/RE"
readme = "README.md"

[lib]
name = "re50"
path = "src/lib.rs"

[[bin]]
name = "re50"
path = "src/main.rs"
doc = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit", "links"] }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"
ttf-parser = "0.25"

[profile.release]
opt-level = 3
lto = true
strip = true
