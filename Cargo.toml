[package]
name = "re50"
version = "1.0.0"
edition = "2021"
description = "RE-50: Reverse Engineering course app (CS50-style) — lectures, labs, problem sets, quizzes, achievements"
license = "MIT"

[lib]
name = "re50"
path = "src/lib.rs"

[[bin]]
name = "re50"
path = "src/main.rs"
doc = false

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
